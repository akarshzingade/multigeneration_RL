<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 640" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <!-- Markers -->
    <marker id="arrowRL" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowKD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
    <marker id="arrowMixed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Title Header -->
  <text x="575" y="42" text-anchor="middle" font-size="24" font-weight="800" fill="url(#headerGrad)" letter-spacing="0.5">POPULATION LINEAGE DAG &amp; PARETO FRONTIER EXPLORATION</text>
  <text x="575" y="66" text-anchor="middle" font-size="13" font-weight="400" fill="#94a3b8">Visualizing Model Evolutionary Trajectories, Teacher-Student Links, and Multi-Objective Search</text>

  <!-- ==================== LEFT PANEL: LINEAGE DAG ==================== -->
  <g filter="url(#shadow)">
    <rect x="40" y="90" width="530" height="520" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="40" y="90" width="530" height="46" rx="16" fill="#334155"/>
    <text x="60" y="119" font-size="15" font-weight="700" fill="#ffffff">&#128397; Population Lineage DAG (NetworkX State)</text>

    <!-- Generation 0: Base Model -->
    <circle cx="295" cy="180" r="28" fill="#1e293b" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="295" y="184" text-anchor="middle" font-size="13" font-weight="800" fill="#f8fafc">M&#8320;</text>
    <text x="295" y="222" text-anchor="middle" font-size="10" font-weight="600" fill="#94a3b8">Qwen-0.5B Base (Zero-shot)</text>

    <!-- Generation 1: RL Branch & Teacher Candidate -->
    <!-- M1 (RL Exploration) -->
    <circle cx="160" cy="290" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="160" y="294" text-anchor="middle" font-size="12" font-weight="800" fill="#38bdf8">M&#8321;</text>
    <text x="160" y="328" text-anchor="middle" font-size="10" fill="#cbd5e1">RL (Concise)</text>

    <!-- M2 (Teacher Reference / SFT) -->
    <circle cx="430" cy="290" r="26" fill="#0f172a" stroke="#c084fc" stroke-width="2.5"/>
    <text x="430" y="294" text-anchor="middle" font-size="12" font-weight="800" fill="#c084fc">M&#8322;</text>
    <text x="430" y="328" text-anchor="middle" font-size="10" fill="#cbd5e1">Teacher SFT</text>

    <!-- Generation 2: Multi-Agent Interaction -->
    <!-- M3 (Stuck RL Student) -->
    <circle cx="110" cy="420" r="25" fill="#0f172a" stroke="#f43f5e" stroke-width="2"/>
    <text x="110" y="424" text-anchor="middle" font-size="12" font-weight="800" fill="#f43f5e">M&#8323;</text>
    <text x="110" y="458" text-anchor="middle" font-size="10" fill="#fda4af">RL Plateau</text>

    <!-- M4 (Mixed Learning) -->
    <circle cx="280" cy="420" r="28" fill="#0f172a" stroke="#34d399" stroke-width="3"/>
    <text x="280" y="424" text-anchor="middle" font-size="12" font-weight="800" fill="#34d399">M&#8324;*</text>
    <text x="280" y="458" text-anchor="middle" font-size="10" font-weight="700" fill="#6ee7b7">Mixed RL+KD (H1)</text>

    <!-- M5 (Distilled Peer - Unblocked) -->
    <circle cx="450" cy="420" r="26" fill="#0f172a" stroke="#a78bfa" stroke-width="2.5"/>
    <text x="450" y="424" text-anchor="middle" font-size="12" font-weight="800" fill="#a78bfa">M&#8325;*</text>
    <text x="450" y="458" text-anchor="middle" font-size="10" font-weight="700" fill="#c4b5fd">Cross-KD (H3)</text>

    <!-- Generation 3: Pareto Champion -->
    <circle cx="340" cy="530" r="29" fill="#0f172a" stroke="#fbbf24" stroke-width="3"/>
    <text x="340" y="534" text-anchor="middle" font-size="13" font-weight="900" fill="#fbbf24">&#9733; M&#8326;</text>
    <text x="340" y="572" text-anchor="middle" font-size="10" font-weight="700" fill="#fde68a">Adaptive Champion (H4)</text>

    <!-- Lineage Edges -->
    <!-- M0 -> M1 (RL) -->
    <path d="M 270 198 L 182 268" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowRL)"/>
    <!-- M0 -> M2 (SFT) -->
    <path d="M 320 198 L 408 268" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowKD)"/>
    <!-- M1 -> M3 (RL continuation) -->
    <path d="M 148 314 L 122 392" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-dasharray="3,3"/>
    <!-- M1 -> M4 (Mixed Learning) -->
    <path d="M 180 310 L 260 395" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowMixed)"/>
    <!-- M2 -> M4 (Teacher Distillation) -->
    <path d="M 406 308 L 306 398" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowKD)"/>
    <!-- M2 -> M5 (Peer KD) -->
    <path d="M 435 316 L 445 392" fill="none" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowKD)"/>
    <!-- M4 & M5 -> M6 (Adaptive Co-Evolution) -->
    <path d="M 295 446 L 326 502" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowMixed)"/>
    <path d="M 432 444 L 366 506" fill="none" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowMixed)"/>

    <!-- Legend -->
    <rect x="58" y="545" width="220" height="50" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <line x1="68" y1="558" x2="95" y2="558" stroke="#38bdf8" stroke-width="2"/>
    <text x="102" y="562" font-size="10" fill="#cbd5e1">RL Exploration</text>
    <line x1="68" y1="575" x2="95" y2="575" stroke="#c084fc" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="102" y="579" font-size="10" fill="#cbd5e1">Teacher KD</text>
    <line x1="68" y1="588" x2="95" y2="588" stroke="#34d399" stroke-width="2"/>
    <text x="102" y="591" font-size="10" fill="#cbd5e1">Mixed RL + KD</text>
  </g>

  <!-- ==================== RIGHT PANEL: PARETO FRONTIER ==================== -->
  <g filter="url(#shadow)">
    <rect x="590" y="90" width="520" height="520" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="590" y="90" width="520" height="46" rx="16" fill="#334155"/>
    <text x="610" y="119" font-size="15" font-weight="700" fill="#ffffff">&#128200; Multi-Objective Pareto Frontier (Optuna Study)</text>

    <!-- Coordinate Axes -->
    <!-- Y Axis: Accuracy -->
    <line x1="660" y1="520" x2="660" y2="180" stroke="#64748b" stroke-width="2"/>
    <polygon points="656,182 660,172 664,182" fill="#64748b"/>
    <text x="635" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#38bdf8" transform="rotate(-90 635 200)">GSM8K Dev Accuracy (%) &#8593;</text>

    <!-- X Axis: Diversity / Error Orthogonality -->
    <line x1="660" y1="520" x2="1050" y2="520" stroke="#64748b" stroke-width="2"/>
    <polygon points="1048,516 1058,520 1048,524" fill="#64748b"/>
    <text x="860" y="555" text-anchor="middle" font-size="11" font-weight="700" fill="#34d399">Error Diversity (Jaccard Distance) &#8593;</text>

    <!-- Grid Lines -->
    <line x1="660" y1="440" x2="1040" y2="440" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="648" y="444" text-anchor="end" font-size="10" fill="#64748b">40%</text>

    <line x1="660" y1="360" x2="1040" y2="360" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="648" y="364" text-anchor="end" font-size="10" fill="#64748b">60%</text>

    <line x1="660" y1="280" x2="1040" y2="280" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="648" y="284" text-anchor="end" font-size="10" fill="#64748b">75%</text>

    <line x1="660" y1="200" x2="1040" y2="200" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="648" y="204" text-anchor="end" font-size="10" fill="#64748b">85%</text>

    <!-- Pareto Frontier Curve (Shaded Region & Arc) -->
    <path d="M 720 480 Q 780 260 990 220" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6,4"/>
    <text x="940" y="205" font-size="11" font-weight="800" fill="#fbbf24">Pareto Frontier</text>

    <!-- Scatter Points of Models -->
    <!-- M0 Base -->
    <circle cx="700" cy="490" r="8" fill="#64748b"/>
    <text x="715" y="494" font-size="10" fill="#94a3b8">M&#8320; (Base)</text>

    <!-- M3 Stuck RL (Dominated) -->
    <circle cx="740" cy="410" r="10" fill="#f43f5e" opacity="0.7"/>
    <text x="755" y="414" font-size="10" fill="#f87171">M&#8323; (Dominated)</text>

    <!-- M1 RL Concise (On / Near Frontier) -->
    <circle cx="730" cy="350" r="13" fill="#38bdf8"/>
    <text x="748" y="354" font-size="11" font-weight="700" fill="#38bdf8">M&#8321; (High Acc)</text>

    <!-- M2 Teacher -->
    <circle cx="850" cy="330" r="12" fill="#c084fc"/>
    <text x="868" y="334" font-size="11" fill="#c084fc">M&#8322; (Teacher)</text>

    <!-- M4 Mixed (On Frontier) -->
    <circle cx="820" cy="270" r="14" fill="#34d399"/>
    <text x="838" y="274" font-size="11" font-weight="700" fill="#34d399">M&#8324; (Mixed H1)</text>

    <!-- M5 Cross-KD (High Diversity) -->
    <circle cx="940" cy="280" r="13" fill="#a78bfa"/>
    <text x="958" y="284" font-size="11" font-weight="700" fill="#a78bfa">M&#8325; (Diversity H2)</text>

    <!-- M6 Champion (Top Right on Frontier) -->
    <circle cx="990" cy="220" r="16" fill="#fbbf24"/>
    <text x="1012" y="224" font-size="12" font-weight="800" fill="#fbbf24">&#9733; M&#8326; (Optuna)</text>

    <!-- Legend note -->
    <rect x="650" y="565" width="410" height="35" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="855" y="587" text-anchor="middle" font-size="10" fill="#cbd5e1">Bubble Area &#8733; FLOPs Invested | Gold Points = Pareto-Optimal Retained Set</text>
  </g>

</svg>
