[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "multigen-rl"
version = "0.1.0"
description = "Population-Based Continual Model Development & Adaptive Experimentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "torch>=2.1.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
    "math-verify>=0.1.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "peft>=0.10.0",
    "trl>=0.14.0",
    "networkx>=3.0",
    "optuna>=3.5.0",
    "vllm>=0.4.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "calflops>=0.3.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
include = ["multigen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_functions = ["test_*"]
