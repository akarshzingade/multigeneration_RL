# ==============================================================================
# Configuration: Experiment 1.1 - Standalone RL (GRPO) Baseline
# ==============================================================================
# Baseline established under strict compute parity (1.0e16 FLOPs) on Qwen/Qwen3-0.6B
# using trl.GRPOTrainer with binary correctness verification and format shaping.

experiment_id: "exp1_1_grpo_baseline"
description: "Phase 1 Standalone RL (GRPO) Baseline at strict 1.0e16 FLOPs budget"

model:
  name_or_path: "Qwen/Qwen3-0.6B"
  torch_dtype: "bfloat16"

peft:
  type: "lora"
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

grpo:
  group_size: 8
  learning_rate: 2.0e-5
  kl_beta: 0.04
  clip_epsilon: 0.2
  weight_decay: 0.01
  warmup_ratio: 0.1
  max_prompt_length: 512
  max_completion_length: 512
  temperature: 0.9
  use_vllm: null # auto-detect: True on CUDA, False on macOS / CPU

rewards:
  correctness_weight: 1.0
  format_weight: 0.1

budget:
  target_flops: 1.0e16
  intermediate_eval_interval_flops: 2.0e15

dataset:
  name: "openai/gsm8k"
  subset: "main"
  num_shots: 0

output:
  checkpoints_dir: "checkpoints/exp1_1_grpo"
  dag_path: "population_dag.json"
  eval_output_dir: "evals"

seeds:
  - 42
  - 43
  - 44
