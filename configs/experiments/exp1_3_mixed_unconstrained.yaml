# ==============================================================================
# Configuration: Experiment 1.3 - Mixed Learning (Unconstrained / Plateau-Based)
# ==============================================================================
# Unconstrained Mixed Learning (Distillation Warmup -> GRPO Exploration).
# Transition from Stage 1 (SFT) to Stage 2 (GRPO) and final termination are
# governed by plateau detection, with options for epoch-based and step-based bounds.

experiment_id: "exp1_3_mixed_unconstrained"
description: "Mixed Learning without FLOP constraint, plateau-based phase transition and stopping"
algorithm: "mixed"

# Hybrid mode architecture
mode: "interleaved_sequential" # Options: "interleaved_sequential", "teacher_regularized", "micro_interleaved"
num_cycles: 4 # Used only if mode == "micro_interleaved"

# Reference policy initialization
ref_policy_source: "sft_warmup" # Options: "sft_warmup", "base_model", "ema"
ema_decay: 0.99 # Used only if ref_policy_source == "ema"

# Optimizer transition strategy
optimizer_transition: "reset_and_warmup" # Options: "reset_and_warmup", "carryover_rescale"

model:
  name_or_path: "Qwen/Qwen3-0.6B"
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"

teacher:
  name_or_path: "Qwen/Qwen2.5-Math-7B-Instruct"
  k_samples: 4
  temperature: 0.7
  max_new_tokens: 512
  traces_path: "data/teacher_traces_gsm8k.jsonl"
  budget_ratio: 0.0

peft:
  type: "lora"
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Phase 1: Distillation Configuration (SFT Warmup)
sft_phase:
  learning_rate: 2.0e-4
  batch_size: 8
  gradient_accumulation_steps: 2
  weight_decay: 0.01
  warmup_ratio: 0.05
  max_seq_length: 1024
  response_template: "<think>"

# Phase 2: GRPO Exploration Configuration
grpo_phase:
  group_size: 8
  learning_rate: 2.0e-5
  kl_beta: 0.04
  clip_epsilon: 0.2
  weight_decay: 0.01
  warmup_ratio: 0.10
  max_prompt_length: 512
  max_completion_length: 512
  temperature: 0.9

rewards:
  correctness_weight: 1.0
  format_weight: 0.1

budget:
  target_flops: null # Unconstrained: No FLOP budget cutoff
  accounting_mode: "strict_split"

# Stage Transition & Termination Strategy
stage_transition:
  criterion: "plateau" # Options: "plateau", "epochs", "steps"
  sft_epochs: 1.0 # Max epochs before auto-transition if plateau not hit earlier
  sft_patience: 3 # Early stopping patience for SFT
  grpo_epochs: 2.0 # Max epochs for GRPO stage
  grpo_patience: 3 # Early stopping patience for GRPO

termination:
  criterion: "plateau" # Options: "plateau", "epochs", "steps"
  early_stopping_patience: 3
  early_stopping_threshold: 0.001
  eval_steps: 50

resumption:
  enabled: true
  auto_resume: true
  journal_filename: "recovery_state.json"
  enable_step_checkpoints: true
  checkpoint_interval_steps: 50
  enable_milestone_checkpoints: false
  enable_signal_trapping: true
  save_on_signals:
    - "SIGINT"
    - "SIGTERM"

dataset:
  name: "openai/gsm8k"
  subset: "main"
  num_shots: 0

output:
  checkpoints_dir: "checkpoints/exp1_3_mixed_unconstrained"
  dag_path: "population_dag.json"
  eval_output_dir: "evals"

seeds:
  - 42
  - 43
  - 44
